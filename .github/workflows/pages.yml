name: Publicar dashboard no GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obter arquivos do dashboard
        uses: actions/checkout@v6
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Verificar arquivos essenciais
        run: |
          test -s dist/index.html
          test -s dist/data.js
          node --check dist/app.js
      - name: Preparar site estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
